[workspace]
resolver = "2"
members = [
    "crates/faro-proto",
    "crates/faro-crypto",
    "crates/faro-core",
    "crates/faro-detect",
    "crates/faro-ipc",
    "crates/faro-platform",
    "crates/faro-platform-macos",
    "crates/faro-update",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Internal crates
faro-proto = { path = "crates/faro-proto", version = "0.1.0" }
faro-crypto = { path = "crates/faro-crypto", version = "0.1.0" }
faro-core = { path = "crates/faro-core", version = "0.1.0" }
faro-detect = { path = "crates/faro-detect", version = "0.1.0" }
faro-ipc = { path = "crates/faro-ipc", version = "0.1.0" }
faro-platform = { path = "crates/faro-platform", version = "0.1.0" }
faro-platform-macos = { path = "crates/faro-platform-macos", version = "0.1.0" }
faro-update = { path = "crates/faro-update", version = "0.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
toml = "0.8"
base64 = "0.22"
hex = "0.4"

# Crypto (pinned to the rand_core 0.6 generation so every primitive shares one RNG trait set;
# see docs/DEVELOPMENT.md "Dependency notes" before upgrading)
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
crypto_box = { version = "0.9", features = ["seal", "std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
blake3 = "1.5"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
getrandom = "0.2"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# Errors / misc
thiserror = "2"
anyhow = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rand_distr = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }

# Async / server
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header", "limit", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate"] }
rusqlite = { version = "0.41", features = ["bundled"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }

# Imaging / detection
image = { version = "0.25", default-features = false, features = ["png"] }
fst = "0.4"

# Testing
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
