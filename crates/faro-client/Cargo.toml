[package]
name = "faro-client"
description = "Faro device side of the instance API, shared by the desktop service and the iOS core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
faro-proto.workspace = true
faro-crypto.workspace = true
faro-core.workspace = true
faro-update.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
rand.workspace = true
zeroize.workspace = true
url = "2.5"
httpdate = "1.0"
# rustls (ring provider, like the rest of the workspace) with the OS trust
# store, so instances using a locally installed CA work; no native-tls or
# OpenSSL. rustls and ring both build for aarch64-apple-ios, where the
# native roots come from the Security framework as on macOS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
