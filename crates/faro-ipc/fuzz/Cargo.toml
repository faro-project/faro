# cargo-fuzz harness for the faro-ipc decoder (ARCHITECTURE.md §9).
#
# Requires a nightly toolchain and cargo-fuzz:
#   cargo +nightly fuzz run decode_agent_msg
# The empty [workspace] table keeps this crate out of the main workspace so
# stable `cargo build`/`cargo test` never try to build it.

[package]
name = "faro-ipc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
faro-ipc = { path = ".." }
tokio = { version = "1", features = ["rt", "io-util"] }

[[bin]]
name = "decode_agent_msg"
path = "fuzz_targets/decode_agent_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_service_msg"
path = "fuzz_targets/decode_service_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_decoder"
path = "fuzz_targets/stream_decoder.rs"
test = false
doc = false
bench = false
