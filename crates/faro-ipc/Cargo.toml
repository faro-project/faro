[package]
name = "faro-ipc"
description = "Faro agent<->service local IPC protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
faro-platform.workspace = true
faro-proto.workspace = true
serde.workspace = true
postcard.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

# Peer credentials (getpeereid / SO_PEERCRED) exist only on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

# Named pipes, tokens and security descriptors (the named-pipe transport).
# The 0.61 line is the one tokio and mio already pull in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
