[package]
name = "faro-core"
description = "Faro client core: scheduler, policy, hash chain, outbox, report builder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
faro-proto.workspace = true
faro-crypto.workspace = true
rusqlite.workspace = true
rand.workspace = true
rand_distr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetTickCount64`: the since-boot clock the session agent stamps frames
# with (`faro_agent::identity::mono_ms`), so service and agent agree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
