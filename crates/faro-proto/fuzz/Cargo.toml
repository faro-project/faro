# cargo-fuzz harness for the faro-proto wire decoders (ARCHITECTURE.md §9).
# See docs/DEVELOPMENT.md "Fuzzing".
#
# Requires a nightly toolchain and cargo-fuzz:
#   cargo run --example seed_corpus      # writes corpus/<target>/seed-*
#   cargo +nightly fuzz run api
# The empty [workspace] table keeps this crate out of the main workspace so
# stable `cargo build`/`cargo test` never try to build it.

[package]
name = "faro-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
faro-proto = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[example]]
name = "seed_corpus"
path = "examples/seed_corpus.rs"

[[bin]]
name = "encoding"
path = "fuzz_targets/encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event"
path = "fuzz_targets/event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report"
path = "fuzz_targets/report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api"
path = "fuzz_targets/api.rs"
test = false
doc = false
bench = false
