[package]
name = "faro-detect"
description = "Faro on-device detection: frame handling, dedupe, classifier, blurred thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# ONNX Runtime image classifier (ARCHITECTURE.md §3.5). Off by default so the
# default build never needs the onnxruntime native library. Enabling it pulls
# in `ort`, whose build script downloads prebuilt onnxruntime binaries.
onnx = ["dep:ort"]

[dependencies]
faro-proto.workspace = true
faro-platform.workspace = true
image.workspace = true
fst.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
hex.workspace = true

# Pinned exactly: the 2.0 release candidates change API between rcs.
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }

[[example]]
# The model benchmark and regression gate (docs/DEVELOPMENT.md "Model benchmark").
name = "model-bench"
path = "examples/model-bench.rs"
required-features = ["onnx"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
base64.workspace = true
