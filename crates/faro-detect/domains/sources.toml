# Blocklist sources for the domain category bundle (ARCHITECTURE.md §3.5
# "Context signals", §11). Compiled by the `domains-compile` example; see
# docs/DEVELOPMENT.md "The domain category bundle".
#
# Every source names its category, format, SPDX licence and the BLAKE3 of
# the exact file to use, so a build is reproducible and an upstream change
# can't alter the bundle without a reviewed change to this file. URLs point
# at a fixed commit, never a branch.
#
# Only `approved = true` sources go into shipped bundles, and an approved
# source must have an Apache-2.0-compatible licence (the tool checks it
# against faro_detect::ALLOWED_MODEL_LICENSES). Approving a source is the
# maintainer's call. The downloaded lists are never committed.
#
# To move to a newer upstream revision: change the commit in the URLs and run
# `domains-compile fetch`. It stops at the first file whose hash changed and
# prints the new hash. Check what changed upstream (and that the licence
# hasn't), update that `blake3` pin, and repeat until fetch passes.
version = 1

# --- StevenBlack/hosts --------------------------------------------------
#
# https://github.com/StevenBlack/hosts, MIT
# (https://github.com/StevenBlack/hosts/blob/master/license.txt).
# Its porn and gambling extensions are merges of upstream lists with their
# own licences (extensions/*/*/update.json). Only the MIT ones are approved
# here; the two CC BY 4.0 ones further down wait for sign-off. Each upstream
# list is used separately, from StevenBlack's copy at commit 81f6c19b.
# Sinfonietta's snuff list (extensions/porn/sinfonietta-snuff, MIT) is left
# out: it is violence, not adult content, and violence is not in scope yet.

