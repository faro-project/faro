# (https://github.com/sjhgvr/oisd/blob/main/LICENSE), and each list's header
# links the same file. OISD has no gambling list; its NSFW list maps to
# `adult`. Pinned to sjhgvr/oisd commit d1024579 (the list changes hourly).
[[source]]
