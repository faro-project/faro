[package]
name = "faro-agent"
description = "Faro per-session agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Development switches for `faro-agent run`: `--synthetic` (feed the service
# a scripted fake screen instead of the real one) and
# `--trust-same-uid-service`. Never enable in release builds: the agent is the
# binary the service trusts, and a flag that swaps the real screen for a fake
# one would let anyone blind their allies (crate docs, "Synthetic mode").
dev = []

[dependencies]
faro-ipc.workspace = true
faro-platform.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
faro-platform-macos.workspace = true

[dev-dependencies]
tempfile.workspace = true
