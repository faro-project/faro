[package]
name = "faro-platform-windows"
description = "Faro Windows platform layer (DXGI capture, Win32 foreground and session state, SCM service, session agents, Authenticode)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Everything is Windows-only; on other targets this crate is an empty lib.
[target.'cfg(windows)'.dependencies]
faro-platform.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tracing.workspace = true
# Reduces browser tab URLs to scheme and host (`browser`).
url = "2.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
# The `session_ui` example logs to stderr.
tracing-subscriber.workspace = true
