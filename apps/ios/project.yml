# The Xcode project for Faro on iOS (docs/IOS.md §13). Generate it with
#
#   apps/ios/build-rust.sh      # FaroCore.xcframework and the Swift bindings
#   apps/ios/build-notices.sh   # optional: the licences the app shows
#   cd apps/ios && xcodegen generate
#
# The generated Faro.xcodeproj is git-ignored. The Info.plist and
# entitlements files next to each target are generated too, but checked in,
# so a change to either shows up in review.
#
# Only Faro and FaroTunnel link FaroCore (the Rust core). The monitor and the
# two shield extensions run under a 6 MB memory limit, so they link
# FaroKit (Foundation only) and nothing else; check-extension-sizes.sh
# fails if one of them grows past its size budget.
name: Faro

options:
  bundleIdPrefix: org.faro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    # build-rust.sh builds arm64 only (devices and Apple Silicon Simulators).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No Apple Developer team is configured in the repository. Set it
    # locally (or pass DEVELOPMENT_TEAM=... to xcodebuild) to run on a
    # device; CI builds unsigned with CODE_SIGNING_ALLOWED=NO.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FaroKit:
    path: FaroKit

targets:
  Faro:
    type: application
    platform: iOS
    sources:
      - path: Faro
        excludes:
          - "*.entitlements"
          - Info.plist
      # Generated by build-notices.sh; optional so the project still
      # builds without them (the Licences screen says so).
      - path: Generated/Notices
        optional: true
        buildPhase: resources
      - path: Shared
      - path: ScreenTime
      - path: Generated/FaroCore
        optional: true
    dependencies:
      - package: FaroKit
      - framework: FaroCore.xcframework
        embed: false
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - target: FaroTunnel
      - target: FaroMonitor
      - target: FaroShield
      - target: FaroShieldAction
    entitlements:
      path: Faro/Faro.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.org.faro.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.faro.ios.shared
    info:
      path: Faro/Info.plist
      properties:
        CFBundleDisplayName: Faro
        CFBundleName: Faro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # faro://enroll?... (docs/IOS.md §14)
        CFBundleURLTypes:
          - CFBundleURLName: org.faro.ios
            CFBundleURLSchemes:
              - faro
        NSCameraUsageDescription: Faro uses the camera only to scan the QR code that enrolls this phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.faro.ios

  FaroTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: FaroTunnel
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
      - path: Generated/FaroCore
        optional: true
    dependencies:
      - package: FaroKit
      - framework: FaroCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    entitlements:
      path: FaroTunnel/FaroTunnel.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.org.faro.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.faro.ios.shared
    info:
      path: FaroTunnel/Info.plist
      properties:
        CFBundleDisplayName: Faro Tunnel
        CFBundleName: FaroTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.faro.ios.tunnel

  FaroMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FaroMonitor
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: ScreenTime
    dependencies:
      - package: FaroKit
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
    entitlements:
      path: FaroMonitor/FaroMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.org.faro.ios
    info:
      path: FaroMonitor/Info.plist
      properties:
        CFBundleDisplayName: Faro Monitor
        CFBundleName: FaroMonitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FaroMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.faro.ios.monitor

  FaroShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FaroShield
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: FaroKit
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    entitlements:
      path: FaroShield/FaroShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.org.faro.ios
    info:
      path: FaroShield/Info.plist
      properties:
        CFBundleDisplayName: Faro Shield
        CFBundleName: FaroShield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FaroShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.faro.ios.shield

  FaroShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: FaroShieldAction
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: FaroKit
      - sdk: ManagedSettings.framework
    entitlements:
      path: FaroShieldAction/FaroShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.org.faro.ios
    info:
      path: FaroShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Faro Shield Action
        CFBundleName: FaroShieldAction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FaroShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.faro.ios.shieldaction

schemes:
  Faro:
    build:
      targets:
        Faro: all
    run:
      config: Debug
    archive:
      config: Release
