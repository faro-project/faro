[package]
name = "faro-server"
description = "Faro self-hosted instance server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "faro_server"
path = "src/lib.rs"

[[bin]]
name = "faro-server"
path = "src/main.rs"

[build-dependencies]
# build.rs: CSP hashes of the embedded web app's inline scripts. sha2 0.10 is
# already in the tree (ed25519-dalek).
base64.workspace = true
sha2 = "0.10"

[dependencies]
faro-proto.workspace = true
faro-crypto.workspace = true
faro-update.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64.workspace = true
hex.workspace = true
blake3.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
sqlx.workspace = true
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Mail, TLS, backups.
lettre = { workspace = true, features = ["tokio1-rustls-tls"] }
# Built-in HTTPS (§4.2). ring everywhere: sqlx and lettre already use the ring
# provider, so the build never needs aws-lc's C toolchain.
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
tar = "0.4.46"
# The update mirror's upstream fetches (§3.8). Same TLS stack as the client
# service: rustls with ring and the OS trust store (the container image
# ships ca-certificates), no native-tls/OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
# Instance logos: decoded and re-encoded to PNG before they are stored
# (docs/SELF-HOSTING.md "Branding your instance"). Pure-Rust decoders only.
image = { workspace = true, features = ["jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
faro-update = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
