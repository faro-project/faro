name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, for example of the model gate (model-eval) on main.
  workflow_dispatch:

# Each self-hosted runner takes one job at a time, so a new push to a pull
# request cancels its older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: [self-hosted, macOS, ARM64]
          # Intel Macs are supported in the beta, so the whole workspace
          # also builds and tests natively on x86_64.
          - os: macos-intel
            runner: [self-hosted, macOS, X64]
          - os: windows
            runner: [self-hosted, Windows, X64]
          - os: linux
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain action's steps use `shell: bash`. With WSL installed,
      # the first `bash` on a Windows runner's PATH is WSL's launcher, which
      # can't run the step scripts; put Git Bash ahead of it.
      - if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # The macOS leak test prints its measurements (permission state, which
      # capture path ran, per-window bytes) but Cargo hides a passing test's
      # output. Run it once more with output shown so every CI log carries
      # the numbers. See issue #7 (possible capture memory growth).
      - name: macOS leak-test measurements
        if: runner.os == 'macOS'
        run: cargo test -p faro-platform-macos --test autorelease_growth -- --nocapture
      # The updater's package signature policy in the other kinds of build:
      # a development build may skip the check, a build with a Team ID
      # never does (crates/faro-service/src/update/signature.rs). The
      # workspace run above covers a release build without one.
      - name: Package signature policy (dev build, and with a Team ID)
        if: runner.os == 'macOS'
        run: |
          cargo test -p faro-service --features dev --lib update::signature
          FARO_TEAM_ID=ABCDE12345 cargo test -p faro-service --lib update::signature
      # Development-only detection thresholds: a dev build lowers them, the
      # workspace run above checks a release build never does
      # (crates/faro-service/src/thresholds.rs).
      - name: Development thresholds (dev build)
        if: runner.os == 'macOS'
        run: cargo test -p faro-service --features dev --lib thresholds
      # The ONNX Runtime classifier and the model benchmark harness, run on
      # a synthetic set and a tiny graph the tests generate, and the
      # service's model loading as the package builds it. The `onnx`
      # feature's build script downloads prebuilt ONNX Runtime binaries, so
      # this runs on the macOS runners only (the package build fetches and
      # checks its own copy, see installers/macos/fetch-onnxruntime.sh).
      - name: faro-detect and faro-service with ONNX Runtime
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p faro-detect --features onnx --all-targets -- -D warnings
          cargo test -p faro-detect --features onnx
          cargo clippy -p faro-service --features onnx --all-targets -- -D warnings
          cargo test -p faro-service --features onnx --lib model

  # The SvelteKit web app (web/): format, types and the static build (which
  # fails if a bundled npm package's licence is missing or not on
  # deny.toml's allowlist, web/scripts/third-party.ts), then
  # faro-server built with that bundle embedded (FARO_REQUIRE_WEB=1 fails
  # the build if a page is missing) and its web-serving tests.
  web:
    runs-on: [self-hosted, Linux, ARM64]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p faro-server --lib web
        working-directory: .
        env:
          FARO_REQUIRE_WEB: "1"

  # cargo-deny-action is a Docker image with an x86_64 binary, so it can't
  # run on the ARM64 runner; install the native cargo-deny instead. Same
  # check as the action ran (it passes --all-features by default).
  deny:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check licenses bans sources advisories
      # The third-party notices the server and the macOS package ship
      # (release/notices/third-party.sh): fails if a crate's licence can't
      # be read or isn't on deny.toml's allowlist.
      - name: Third-party notices
        run: |
          cargo install --locked cargo-about --features cli --version "$(release/notices/third-party.sh --cargo-about-version)"
          release/notices/third-party.sh server "$RUNNER_TEMP/notices/server.txt"
          release/notices/third-party.sh macos "$RUNNER_TEMP/notices/macos.txt"
          rm -rf "$RUNNER_TEMP/notices"

  # The release scripts (release/, docs/DEVELOPMENT.md "Releasing"), end to
  # end: throwaway keys, fake artifacts and a local git repository standing
  # in for the publishing location. No secrets.
  release-scripts:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p faro-update --example faro-release
      - run: release/test-release.sh

  # The macOS installer: build the unsigned, universal (arm64 + x86_64)
  # development package (a release package needs the project's Developer ID)
  # and check its payload, scripts and installer options without installing
  # it. `macos-pkg-intel` then checks the same package on the Intel Mac.
  macos-pkg:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-about --features cli --version "$(release/notices/third-party.sh --cargo-about-version)"
      - run: installers/macos/build-pkg.sh --dev
      - run: installers/macos/check-pkg.sh target/pkg/Faro-*-dev.pkg
      - run: installers/macos/test-uninstall.sh
      # For installing on a test machine. Unsigned, universal, and its
      # service accepts any program running as a logged-in user as the
      # agent: never use it on anyone.
      - uses: actions/upload-artifact@v4
        with:
          name: faro-dev-pkg-universal-${{ github.sha }}
          path: target/pkg/Faro-*-dev.pkg
          if-no-files-found: error
          retention-days: 14

  # The universal package on the Intel Mac: check it (check-pkg.sh runs the
  # x86_64 faro-service's model-check, so the packaged model is classified
  # with ONNX Runtime on Intel too), then expand it (never install it) and
  # start the x86_64 slice of each program with `--version`, which shows
  # the Intel slices load and run.
  macos-pkg-intel:
    needs: macos-pkg
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: faro-dev-pkg-universal-${{ github.sha }}
          path: pkg-intel
      - run: installers/macos/check-pkg.sh pkg-intel/Faro-*-dev.pkg
      - name: Start the x86_64 programs
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          pkgutil --expand-full pkg-intel/Faro-*-dev.pkg pkg-intel/expanded
          faro=pkg-intel/expanded/faro-component.pkg/Payload/Library/Faro
          for bin in "$faro/bin/faro-service" "$faro/Faro Agent.app/Contents/MacOS/faro-agent"; do
            out="$(arch -x86_64 "$bin" --version)"
            echo "$out"
            if [[ "$out" != "$(basename "$bin") $version" ]]; then
              echo "::error::$(basename "$bin") --version printed \"$out\" (want $version)"
              exit 1
            fi
          done
      - if: always()
        run: rm -rf pkg-intel

  # The Windows installer: build the unsigned development MSI (a release one
  # needs a signing provider, installers/windows/sign.ps1) and run check-msi.ps1
  # on it: its tables and files, then, when the runner is elevated, a real
  # install, the service, its DACL, the faro:// handler and the state
  # directory's ACL, and an uninstall that leaves nothing behind.
  # -NoOnnx: CI has no copy of the image model (it is built on macOS), so
  # the MSI here is the one without the classifier. The release job ships
  # the model (-ModelDir) and the classifier.
  #
  # Not for pull requests from forks: the job runs the PR's own code, and
  # `check-msi.ps1` installs and uninstalls a service as SYSTEM on a shared,
  # unsandboxed runner. The install half also runs only where the runner sets
  # FARO_CHECK_MSI_INSTALL=1 (docs/DEVELOPMENT.md "CI runners").
  windows-msi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The toolchain action's steps use `shell: bash`; see `test`.
      - shell: powershell
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-about and WiX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $about = (& 'C:\Program Files\Git\bin\bash.exe' -o igncr release/notices/third-party.sh --cargo-about-version).Trim()
          cargo install --locked cargo-about --features cli --version $about
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about' }
          # build-msi.ps1 checks the version and adds the WiX extensions.
          $want = (Select-String -Path installers/windows/build-msi.ps1 -Pattern "^.WixVersion = '(.*)'").Matches[0].Groups[1].Value
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $have = if (Get-Command wix -ErrorAction SilentlyContinue) { (& wix --version) -replace '\+.*$', '' } else { '' }
          if ($have -ne $want) {
            dotnet tool update --global wix --version $want
            if ($LASTEXITCODE -ne 0) { dotnet tool install --global wix --version $want }
            if ($LASTEXITCODE -ne 0) { throw 'wix' }
          }
      - name: Build the development MSI
        shell: powershell
        run: installers\windows\build-msi.ps1 -Dev -NoOnnx
      - name: Check the MSI
        shell: powershell
        run: installers\windows\check-msi.ps1 (Get-Item target\msi\Faro-*-dev-x64.msi).FullName
      # For installing on a test machine. Unsigned, and its service accepts any
      # program running in a signed-in account as the agent: never use it on
      # anyone.
      - uses: actions/upload-artifact@v4
        with:
          name: faro-dev-msi-${{ github.sha }}
          path: target/msi/Faro-*-dev-x64.msi
          if-no-files-found: error
          retention-days: 14

  # The model regression gate on the real, maintainer-curated test set
  # (docs/DEVELOPMENT.md "Model benchmark"). The set holds explicit imagery
  # and lives only on the macOS runner, outside the repository: the job is
  # skipped unless the runner's .env sets FARO_MODEL_EVAL_SET (the set) and
  # FARO_MODEL_EVAL_MANIFEST (the model under test). Only the metrics JSON
  # is uploaded, never an image or a per-image result. It runs on main only
  # (pushes and manual runs), never on a pull request, so changes to the
  # harness are reviewed before they run against the real set.
  model-eval:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - id: check
        run: |
          if [ -n "${FARO_MODEL_EVAL_SET:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "FARO_MODEL_EVAL_SET is not set on this runner: skipping the model gate"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Benchmark
        if: steps.check.outputs.enabled == 'true'
        run: |
          if [ -z "${FARO_MODEL_EVAL_MANIFEST:-}" ]; then
            echo "::error::FARO_MODEL_EVAL_SET is set but FARO_MODEL_EVAL_MANIFEST is not"
            exit 2
          fi
          mkdir -p target/model-eval
          rm -f target/model-eval/results.json
          cargo run --release -p faro-detect --features onnx --example model-bench -- \
            --manifest "$FARO_MODEL_EVAL_MANIFEST" --set "$FARO_MODEL_EVAL_SET" \
            --json target/model-eval/results.json
      - name: Gate against the baseline
        if: steps.check.outputs.enabled == 'true'
        run: |
          if [ ! -f models/eval-baseline.json ]; then
            echo "::warning::No models/eval-baseline.json yet: nothing to gate against. Check in this run's metrics artifact to start gating."
            exit 0
          fi
          cargo run --release -p faro-detect --features onnx --example model-bench -- \
            --results target/model-eval/results.json --baseline models/eval-baseline.json
      # Metrics only: aggregate counts, ratios, timings and a digest of the
      # set. This is what a new baseline is made from.
      - if: always() && steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-metrics-${{ github.sha }}
          path: target/model-eval/results.json
          if-no-files-found: ignore
          retention-days: 30
