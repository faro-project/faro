# Asks every outside contributor to sign CLA.md, and records signatures in
# signatures/cla-v1.json on the `cla-signatures` branch.
#
# Security: this runs on `pull_request_target` with a write token, so it must
# never check out or run code from the pull request, and it runs on a
# GitHub-hosted runner, never the project's self-hosted ones (see
# DEVELOPMENT.md "CI runners"). The action only reads PR metadata and comments.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Faro CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/faro-project/faro/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          # The maintainer holds the copyright already; bots don't sign.
          allowlist: isaiah-zimmerman,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Faro CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please
            read the [Faro Contributor License Agreement](https://github.com/faro-project/faro/blob/main/CLA.md).
            You keep the copyright in your work, and every contribution stays
            available under the AGPL. To sign, post a comment with exactly the
            text below.
          custom-allsigned-prcomment: Every contributor to this pull request has signed the Faro CLA.
