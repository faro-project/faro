# Builds deploy/Dockerfile for linux/amd64 and linux/arm64 (Raspberry Pi 4/5
# with 64-bit OS) and publishes one multi-arch image to
#
#     ghcr.io/faro-project/faro-server
#
# Tags:
#   main            latest commit on main (pre-alpha: can be broken)
#   sha-<short>     a specific commit
#
# Release images (X.Y.Z, X.Y, latest) are built and tagged by release.yml,
# after the release's update metadata is verified, so this workflow no
# longer runs on v* tags.
#
# Each platform builds natively on GitHub's runners (docs/DEVELOPMENT.md,
# "CI runners"), never under QEMU emulation:
#
#   linux/arm64   ubuntu-24.04-arm
#   linux/amd64   ubuntu-24.04. The repository variable FARO_LINUX_X64_RUNNER
#                 (JSON, the same one release.yml reads) moves it.
#   publish       the merge job, on ubuntu-24.04
#
# Pull requests that touch the container files build both platforms and
# smoke-test them (the `test` job), with a read-only token and no registry
# login. Pushes to main and manual runs build in the `build` job instead,
# the only jobs here whose token can write packages: each pushes its image
# by digest only, and the merge job joins the digests into one manifest
# list and applies the tags. Both jobs show as `build (<platform>)`.
#
# If one platform's build fails on a push to main, the merge job still
# publishes the platforms that built (with a warning naming the missing
# one), so a broken amd64 build doesn't hold back the arm64 image for
# Raspberry Pis. The tags then point at an image without that platform
# until the next good build.
# (A release, in release.yml, needs every platform: it is never published
# half-built.)

name: Container image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - deploy/healthcheck.sh
      - web/package.json
      - web/package-lock.json
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/faro-project/faro-server

jobs:
  # Pull requests: build each platform into the runner's Docker daemon and
  # smoke-test it. Nothing is pushed, and the token can't write packages.
  test:
    name: build (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the `build` job's matrix.
        include:
          - platform: linux/amd64
            runner: ${{ vars.FARO_LINUX_X64_RUNNER || '"ubuntu-24.04"' }}
          - platform: linux/arm64
            runner: '"ubuntu-24.04-arm"'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      REF: faro-server:ci-${{ github.run_id }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v5

      - name: Docker
        run: |
          docker version --format 'Docker {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}' || {
            echo "::error::No Docker daemon on this runner. See docs/DEVELOPMENT.md, CI runners."
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=docker,name=${{ env.REF }}

      # The builder stage already runs `faro-server version`; this runs it
      # again in the runtime stage, which checks the glibc match and that
      # the unprivileged user can execute it, natively on each architecture.
      - name: Smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" "$REF" version
          docker run --rm --platform "$PLATFORM" --entrypoint uname "$REF" -m

  # Pushes to main and manual runs: build each platform and push it by
  # digest only; `merge` applies the tags.
  build:
    name: build (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the `test` job's matrix and with PLATFORMS in
        # the merge job.
        include:
          - platform: linux/amd64
            runner: ${{ vars.FARO_LINUX_X64_RUNNER || '"ubuntu-24.04"' }}
          - platform: linux/arm64
            runner: '"ubuntu-24.04-arm"'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Docker
        run: |
          docker version --format 'Docker {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}' || {
            echo "::error::No Docker daemon on this runner. See docs/DEVELOPMENT.md, CI runners."
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      # Logs out again when the job ends (the action's default), so the
      # token isn't left in the runner's Docker config.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the OCI labels are used here; the merge job applies the tags.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # As in the `test` job, on the image just pushed.
      - name: Smoke test
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" "$REF" version
          docker run --rm --platform "$PLATFORM" --entrypoint uname "$REF" -m

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch image
    # always(): run even when a build job failed (see the header). Never
    # after a cancellation.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.build.result != 'cancelled'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # One directory per platform (digests-linux-amd64/…), so the next
      # step can tell which platforms built.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Platforms that built
        id: digests
        env:
          # Keep in step with the build matrix.
          PLATFORMS: linux-amd64 linux-arm64
        run: |
          shopt -s nullglob
          refs=""
          for p in $PLATFORMS; do
            files=("$RUNNER_TEMP/digests/digests-$p"/*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::warning title=Partial image::No $p image: its build failed, so this publish has only the other platforms."
              continue
            fi
            for f in "${files[@]}"; do
              refs="$refs $IMAGE@sha256:$(basename "$f")"
            done
          done
          if [ -z "$refs" ]; then
            echo "::error::No platform built; nothing to publish."
            exit 1
          fi
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Create manifest list and push
        env:
          REFS: ${{ steps.digests.outputs.refs }}
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $REFS

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

      - if: always()
        run: rm -rf "$RUNNER_TEMP/digests"
