# Builds deploy/Dockerfile for linux/amd64 and linux/arm64 (Raspberry Pi 4/5
# with 64-bit OS) and publishes one multi-arch image to
#
#     ghcr.io/faro-project/faro-server
#
# Tags:
#   main            latest commit on main (pre-alpha: can be broken)
#   sha-<short>     a specific commit
#
# Release images (X.Y.Z, X.Y, latest) are built and tagged by release.yml,
# after the release's update metadata is verified, so this workflow no
# longer runs on v* tags.
#
# Each platform builds natively on its own runner (ubuntu-24.04 and
# ubuntu-24.04-arm), so there is no slow QEMU emulation. Each job pushes its
# image by digest only; the merge job then joins the digests into one
# manifest list and applies the tags. Pull requests that touch the container
# files build both platforms and smoke-test them, but push nothing.
#
# If one platform's build fails on a push to main, the merge job still
# publishes the platforms that built (with a warning naming the missing
# one), so a broken amd64 build on GitHub's runners doesn't hold back the
# arm64 image for Raspberry Pis. The tags then point at an image without
# that platform until the next good build. (A release, in release.yml, needs
# every platform: it is never published half-built.)

name: Container image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - deploy/healthcheck.sh
      - web/package.json
      - web/package-lock.json
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/faro-project/faro-server
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No self-hosted x86_64 Linux runner yet, so amd64 stays on
          # GitHub's runners; arm64 builds natively on the Raspberry Pi.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the OCI labels are used here; the merge job applies the tags.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Push builds go to the registry by digest. PR builds load into the
      # local Docker daemon instead, so the smoke test below can run them.
      - id: output
        run: |
          if [ "$PUSH" = true ]; then
            echo "spec=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec=type=docker,name=faro-server:ci" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ steps.output.outputs.spec }}

      # The builder stage already runs `faro-server version`; this runs it
      # again in the runtime stage, which checks the glibc match and that
      # the unprivileged user can execute it, natively on each architecture.
      - name: Smoke test
        env:
          REF: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || 'faro-server:ci' }}
        run: |
          docker run --rm "$REF" version
          docker run --rm --entrypoint uname "$REF" -m

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch image
    # always(): run even when a build job failed (see the header). Never
    # after a cancellation.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.build.result != 'cancelled'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # One directory per platform (digests-linux-amd64/…), so the next
      # step can tell which platforms built.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Platforms that built
        id: digests
        env:
          # Keep in step with the build matrix.
          PLATFORMS: linux-amd64 linux-arm64
        run: |
          shopt -s nullglob
          refs=""
          for p in $PLATFORMS; do
            files=("$RUNNER_TEMP/digests/digests-$p"/*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::warning title=Partial image::No $p image: its build failed, so this publish has only the other platforms."
              continue
            fi
            for f in "${files[@]}"; do
              refs="$refs $IMAGE@sha256:$(basename "$f")"
            done
          done
          if [ -z "$refs" ]; then
            echo "::error::No platform built; nothing to publish."
            exit 1
          fi
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Create manifest list and push
        env:
          REFS: ${{ steps.digests.outputs.refs }}
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $REFS

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
