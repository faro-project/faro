# Builds deploy/Dockerfile for linux/amd64 and linux/arm64 (Raspberry Pi 4/5
# with 64-bit OS) and publishes one multi-arch image to
#
#     ghcr.io/faro-project/faro-server
#
# Tags:
#   main            latest commit on main (pre-alpha: can be broken)
#   sha-<short>     a specific commit
#   X.Y.Z, X.Y      a release tag vX.Y.Z
#   latest          the newest non-prerelease release tag
#
# Each platform builds natively on its own runner (ubuntu-24.04 and
# ubuntu-24.04-arm), so there is no slow QEMU emulation. Each job pushes its
# image by digest only; the merge job then joins the digests into one
# manifest list and applies the tags. Pull requests that touch the container
# files build both platforms and smoke-test them, but push nothing.

name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - deploy/healthcheck.sh
      - web/package.json
      - web/package-lock.json
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/faro-project/faro-server
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No self-hosted x86_64 Linux runner yet, so amd64 stays on
          # GitHub's runners; arm64 builds natively on the Raspberry Pi.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the OCI labels are used here; the merge job applies the tags.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Push builds go to the registry by digest. PR builds load into the
      # local Docker daemon instead, so the smoke test below can run them.
      - id: output
        run: |
          if [ "$PUSH" = true ]; then
            echo "spec=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec=type=docker,name=faro-server:ci" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ steps.output.outputs.spec }}

      # The builder stage already runs `faro-server version`; this runs it
      # again in the runtime stage, which checks the glibc match and that
      # the unprivileged user can execute it, natively on each architecture.
      - name: Smoke test
        env:
          REF: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || 'faro-server:ci' }}
        run: |
          docker run --rm "$REF" version
          docker run --rm --entrypoint uname "$REF" -m

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
